[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "focusboard"
version = "0.1.0"
description = "Ubuntu reminder and task-tracking desktop app"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
focusboard = "focusboard.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
focusboard = ["py.typed"]
